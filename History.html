<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search History - AI Career Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a2332 50%, #2d3b4e 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.5rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .highlight {
            color: #3b82f6;
        }

        .header p {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        /* Navigation */
        .nav-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .nav-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }

        .nav-btn.secondary {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
        }

        .user-info {
            position: fixed;
            top: 70px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 10px;
            border: 1px solid rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }

        .user-name {
            color: #3b82f6;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .logout-btn {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .logout-btn:hover {
            background: rgba(248, 113, 113, 0.3);
            color: #f1f5f9;
        }

        /* Filter Section */
        .filter-section {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-section input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 2px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            background: rgba(10, 14, 26, 0.85);
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .filter-section input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .filter-section select {
            padding: 14px 18px;
            border: 2px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            background: rgba(10, 14, 26, 0.85);
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-section select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .clear-all-btn {
            padding: 14px 24px;
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .clear-all-btn:hover {
            background: rgba(248, 113, 113, 0.3);
            color: #f1f5f9;
        }

        /* History Stats */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 8px;
        }

        .stat-card .stat-label {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* History List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .history-item {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            position: relative;
        }

        .history-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
            transform: translateY(-2px);
        }

        .history-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .history-date {
            color: #94a3b8;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-weight: 500;
        }

        .view-btn {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #93c5fd;
        }

        .view-btn:hover {
            background: rgba(37, 99, 235, 0.3);
            color: #f1f5f9;
        }

        .delete-btn {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
        }

        .delete-btn:hover {
            background: rgba(248, 113, 113, 0.3);
            color: #f1f5f9;
        }

        .history-details {
            display: grid;
            gap: 16px;
        }

        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .detail-label {
            color: #94a3b8;
            font-size: 0.9rem;
            min-width: 120px;
            font-weight: 600;
        }

        .detail-value {
            color: #e2e8f0;
            font-size: 0.95rem;
            flex: 1;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #c084fc;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #94a3b8;
        }

        .empty-state p {
            color: #64748b;
            margin-bottom: 30px;
        }

        .empty-state .nav-btn {
            display: inline-block;
        }

        /* Confirmation Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(59, 130, 246, 0.4);
            text-align: center;
        }

        .modal-content h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: #f1f5f9;
        }

        .modal-content p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .modal-btn.confirm {
            background: rgba(248, 113, 113, 0.3);
            border: 1px solid rgba(248, 113, 113, 0.5);
            color: #fca5a5;
        }

        .modal-btn.confirm:hover {
            background: rgba(248, 113, 113, 0.4);
            color: #f1f5f9;
        }

        .modal-btn.cancel {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #93c5fd;
        }

        .modal-btn.cancel:hover {
            background: rgba(37, 99, 235, 0.3);
            color: #f1f5f9;
        }

        @media (max-width: 768px) {
            .nav-bar {
                position: static;
                justify-content: center;
                margin-bottom: 20px;
            }

            .user-info {
                position: static;
                margin: 0 auto 20px;
                width: fit-content;
            }

            .filter-section {
                flex-direction: column;
            }

            .filter-section input,
            .filter-section select {
                width: 100%;
            }

            .stats-section {
                grid-template-columns: 1fr;
            }

            .history-item-header {
                flex-direction: column;
                gap: 12px;
            }

            .history-actions {
                width: 100%;
            }

            .action-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav-bar">
        <a href="index.html" class="nav-btn">🏠 Home</a>
        <button onclick="handleLogout()" class="nav-btn secondary">Logout</button>
    </div>

    <div id="userInfo" class="user-info" style="display: none;">
        <span class="user-name" id="userName"></span>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">📚</div>
            <h1>Search <span class="highlight">History</span></h1>
            <p>Track your career exploration journey</p>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="totalSearches">0</div>
                <div class="stat-label">Total Searches</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="thisWeek">0</div>
                <div class="stat-label">This Week</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="thisMonth">0</div>
                <div class="stat-label">This Month</div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <input type="text" id="searchFilter" placeholder="🔍 Search history..." oninput="filterHistory()">
            <select id="sortFilter" onchange="filterHistory()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>
            <button class="clear-all-btn" onclick="confirmClearAll()">🗑️ Clear All</button>
        </div>

        <!-- History List -->
        <div id="historyList" class="history-list">
            <!-- History items will be inserted here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📭</div>
            <h3>No Search History Yet</h3>
            <p>Start your career exploration journey by creating your first search!</p>
            <a href="index.html" class="nav-btn">Start Exploring</a>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle">Confirm Action</h3>
            <p id="modalMessage">Are you sure you want to proceed?</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn confirm" id="confirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let historyData = [];
        let currentAction = null;

        // Initialize on page load
        window.addEventListener('load', () => {
            checkAuthentication();
            loadHistory();
            updateStats();
        });

        // Check if user is logged in
        function checkAuthentication() {
            const user = localStorage.getItem('currentUser');
            if (!user) {
                window.location.href = 'Auth.html';
                return;
            }
            
            currentUser = JSON.parse(user);
            document.getElementById('userName').textContent = `👋 ${currentUser.name}`;
            document.getElementById('userInfo').style.display = 'flex';
        }

        // Load history from localStorage
        function loadHistory() {
            const historyKey = `careerHistory_${currentUser.email}`;
            const savedHistory = localStorage.getItem(historyKey);
            
            if (savedHistory) {
                historyData = JSON.parse(savedHistory);
                renderHistory();
            } else {
                showEmptyState();
            }
        }

        // Save history to localStorage
        function saveHistory() {
            const historyKey = `careerHistory_${currentUser.email}`;
            localStorage.setItem(historyKey, JSON.stringify(historyData));
        }

        // Add new search to history (called from index.html)
        function addToHistory(searchData) {
            const historyEntry = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                ...searchData
            };
            
            historyData.unshift(historyEntry); // Add to beginning
            saveHistory();
            updateStats();
            renderHistory();
        }

        // Render history items
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            
            if (historyData.length === 0) {
                showEmptyState();
                return;
            }

            emptyState.style.display = 'none';
            historyList.innerHTML = '';

            historyData.forEach(item => {
                const historyItem = createHistoryItem(item);
                historyList.appendChild(historyItem);
            });
        }

        // Create history item HTML
        function createHistoryItem(item) {
            const div = document.createElement('div');
            div.className = 'history-item';
            
            const date = new Date(item.timestamp);
            const formattedDate = formatDate(date);
            
            div.innerHTML = `
                <div class="history-item-header">
                    <div class="history-date">
                        🕒 ${formattedDate}
                    </div>
                    <div class="history-actions">
                        <button class="action-btn view-btn" onclick="viewDetails(${item.id})">👁️ View</button>
                        <button class="action-btn delete-btn" onclick="confirmDelete(${item.id})">🗑️ Delete</button>
                    </div>
                </div>
                <div class="history-details">
                    <div class="detail-row">
                        <div class="detail-label">🎓 Education:</div>
                        <div class="detail-value">${item.education || 'Not specified'}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">💼 Experience:</div>
                        <div class="detail-value">${item.experience || 'Not specified'} years</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">📍 Location:</div>
                        <div class="detail-value">${item.location || 'Not specified'}</div>
                    </div>
                    ${item.skills && item.skills.length > 0 ? `
                    <div class="detail-row">
                        <div class="detail-label">🛠️ Skills:</div>
                        <div class="skills-list">
                            ${item.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                        </div>
                    </div>
                    ` : ''}
                    ${item.interests ? `
                    <div class="detail-row">
                        <div class="detail-label">💡 Interests:</div>
                        <div class="detail-value">${item.interests}</div>
                    </div>
                    ` : ''}
                </div>
            `;
            
            return div;
        }

        // Format date
        function formatDate(date) {
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            if (days < 7) return `${days} day${days > 1 ? 's' : ''} ago`;
            
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Update statistics
        function updateStats() {
            const now = new Date();
            const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const oneMonthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

            const totalSearches = historyData.length;
            const thisWeek = historyData.filter(item => new Date(item.timestamp) > oneWeekAgo).length;
            const thisMonth = historyData.filter(item => new Date(item.timestamp) > oneMonthAgo).length;

            document.getElementById('totalSearches').textContent = totalSearches;
            document.getElementById('thisWeek').textContent = thisWeek;
            document.getElementById('thisMonth').textContent = thisMonth;
        }

        // Filter history
        function filterHistory() {
            const searchTerm = document.getElementById('searchFilter').value.toLowerCase();
            const sortOrder = document.getElementById('sortFilter').value;

            let filtered = [...historyData];

            // Filter by search term
            if (searchTerm) {
                filtered = filtered.filter(item => {
                    return (
                        (item.education && item.education.toLowerCase().includes(searchTerm)) ||
                        (item.location && item.location.toLowerCase().includes(searchTerm)) ||
                        (item.interests && item.interests.toLowerCase().includes(searchTerm)) ||
                        (item.skills && item.skills.some(skill => skill.toLowerCase().includes(searchTerm)))
                    );
                });
            }

            // Sort
            if (sortOrder === 'oldest') {
                filtered.reverse();
            }

            // Render filtered results
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            if (filtered.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <h3>No Results Found</h3>
                        <p>Try adjusting your search filters</p>
                    </div>
                `;
            } else {
                filtered.forEach(item => {
                    const historyItem = createHistoryItem(item);
                    historyList.appendChild(historyItem);
                });
            }
        }

        // View details (redirect to index with prepopulated data)
        function viewDetails(id) {
            const item = historyData.find(h => h.id === id);
            if (item) {
                // Store selected item in sessionStorage
                sessionStorage.setItem('viewHistoryItem', JSON.stringify(item));
                window.location.href = 'index.html?fromHistory=true';
            }
        }

        // Confirm delete single item
        function confirmDelete(id) {
            currentAction = { type: 'delete', id };
            document.getElementById('modalTitle').textContent = 'Delete Search Entry';
            document.getElementById('modalMessage').textContent = 'Are you sure you want to delete this search entry? This action cannot be undone.';
            document.getElementById('confirmBtn').onclick = () => deleteItem(id);
            document.getElementById('confirmModal').classList.add('show');
        }

        // Delete single item
        function deleteItem(id) {
            historyData = historyData.filter(item => item.id !== id);
            saveHistory();
            updateStats();
            renderHistory();
            closeModal();
        }

        // Confirm clear all
        function confirmClearAll() {
            if (historyData.length === 0) {
                return;
            }
            
            currentAction = { type: 'clearAll' };
            document.getElementById('modalTitle').textContent = 'Clear All History';
            document.getElementById('modalMessage').textContent = 'Are you sure you want to delete all search history? This action cannot be undone.';
            document.getElementById('confirmBtn').onclick = clearAllHistory;
            document.getElementById('confirmModal').classList.add('show');
        }

        // Clear all history
        function clearAllHistory() {
            historyData = [];
            saveHistory();
            updateStats();
            showEmptyState();
            closeModal();
        }

        // Show empty state
        function showEmptyState() {
            document.getElementById('historyList').innerHTML = '';
            document.getElementById('emptyState').style.display = 'block';
        }

        // Modal functions
        function closeModal() {
            document.getElementById('confirmModal').classList.remove('show');
            currentAction = null;
        }

        // Logout handler
        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'Auth.html';
        }

        // Close modal when clicking outside
        document.getElementById('confirmModal').addEventListener('click', (e) => {
            if (e.target.id === 'confirmModal') {
                closeModal();
            }
        });

        // Make addToHistory globally accessible for use from index.html
        window.addToHistory = addToHistory;
    </script>
</body>
</html>
