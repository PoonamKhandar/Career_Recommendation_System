<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Guide - Expandable View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a2332 50%, #2d3b4e 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 2.5rem;
        }

        .auth-link {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-block;
            z-index: 1000;
        }

        .auth-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }

        .user-info {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(26, 35, 50, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 10px;
            border: 1px solid rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
        }

        .user-name {
            color: #3b82f6;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .logout-btn {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(248, 113, 113, 0.3);
            color: #f1f5f9;
        }

        .history-link {
            padding: 8px 16px;
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #93c5fd;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .history-link:hover {
            background: rgba(37, 99, 235, 0.3);
            color: #f1f5f9;
            transform: translateY(-2px);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .highlight {
            color: #3b82f6;
        }

        .header p {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .form-container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 500;
            color: #e2e8f0;
            font-size: 1rem;
            gap: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            background: rgba(10, 14, 26, 0.85);
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(10, 14, 26, 0.8);
        }

        .input-with-button {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-with-button input {
            flex: 1;
        }

        .add-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .add-btn:hover {
            transform: scale(1.05);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tag {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #c084fc;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag .remove-btn {
            background: none;
            border: none;
            color: #c084fc;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .tag .remove-btn:hover {
            color: #f1f5f9;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            text-align: center;
            background: rgba(26, 35, 50, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(37, 99, 235, 0.4);
        }

        .spinner {
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-page {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
        }

        .results-page.show {
            display: block;
        }

        .results-header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .results-header h2 {
            font-size: 2.5rem;
            color: #3b82f6;
            margin-bottom: 16px;
        }

        .results-header p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .back-btn {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        /* Expandable Career Cards */
        .career-card-compact {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .career-card-compact:hover {
            border-color: rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }

        .career-card-compact.expanded {
            border-color: rgba(139, 92, 246, 0.6);
        }

        .career-card-header {
            padding: 25px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
        }

        .career-title-section {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .career-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(37, 99, 235, 0.2);
            border-radius: 15px;
        }

        .career-title-info {
            flex: 1;
        }

        .career-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .career-quick-info {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .match-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .salary-badge {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(251, 146, 60, 0.3);
        }

        .expand-icon {
            font-size: 1.5rem;
            color: #3b82f6;
            transition: transform 0.3s ease;
        }

        .career-card-compact.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .career-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .career-card-compact.expanded .career-details {
            max-height: 10000px;
        }

        .career-content {
            padding: 0 30px 30px 30px;
        }

        .career-description {
            color: #d4d4d8;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border-left: 4px solid #8b5cf6;
        }

        .two-column-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-section {
            background: rgba(10, 14, 26, 0.85);
            border: 1px solid rgba(139, 92, 246, 0.1);
            border-radius: 16px;
            padding: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            color: #3b82f6;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .strengths-list, .development-list {
            list-style: none;
            padding: 0;
        }

        .strengths-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            color: #22c55e;
            font-weight: 500;
        }

        .strengths-list li::before {
            content: '✓';
            color: #22c55e;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .development-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            color: #f59e0b;
            font-weight: 500;
        }

        .development-list li::before {
            content: '→';
            color: #f59e0b;
            font-weight: bold;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .progression-path {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progression-step {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
        }

        .step-number {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .step-title {
            color: #f1f5f9;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .salary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .salary-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 12px;
            padding: 18px;
        }

        .salary-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .salary-amount {
            color: #22c55e;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .industry-insights {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .industry-insights h4 {
            color: #3b82f6;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .insight-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
            color: #e2e8f0;
            font-size: 0.92rem;
        }

        .insight-item::before {
            content: '📈';
            flex-shrink: 0;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #c084fc;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
        }

        .roadmap-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-top: 25px;
        }

        .phase-card {
            background: rgba(10, 14, 26, 0.85);
            border: 1px solid rgba(139, 92, 246, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .phase-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .phase-number {
            width: 40px;
            height: 40px;
            background: #8b5cf6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .phase-info h4 {
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .phase-duration {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .skills-section {
            margin-bottom: 18px;
        }

        .skills-section h5 {
            color: #c084fc;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .resources-section h5 {
            color: #60a5fa;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .resource-card {
            background: rgba(10, 14, 26, 0.85);
            border: 1px solid rgba(100, 100, 100, 0.3);
            border-radius: 10px;
            padding: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.2s;
            display: block;
        }

        .resource-card:hover {
            border-color: #60a5fa;
            transform: translateY(-2px);
        }

        .resource-name {
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        .resource-type {
            font-size: 0.72rem;
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .type-free {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .type-paid {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }

        .type-freemium {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }

        .certifications-section {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .certifications-section h4 {
            margin-bottom: 14px;
            font-size: 1.05rem;
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .cert-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
        }

        .click-hint {
            color: #94a3b8;
            font-size: 0.85rem;
            font-style: italic;
            margin-top: 5px;
        }

        @media (max-width: 1200px) {
            .two-column-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .resources-grid {
                grid-template-columns: 1fr;
            }
            
            .salary-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .results-header h2 {
                font-size: 2rem;
            }

            .career-title {
                font-size: 1.4rem;
            }

            .career-title-section {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Section -->
    <div id="authSection"></div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <h3>Analyzing Your Profile...</h3>
            <p style="color: #94a3b8; margin-top: 10px;">Generating comprehensive career recommendations</p>
        </div>
    </div>

    <div class="container" id="mainPage">
        <div class="header">
            <div class="header-icon">🤖</div>
            <h1><span class="highlight"></span> Career Guide</h1>
            <p>Discover your ideal career path with comprehensive analysis</p>
        </div>

        <div class="form-container">
            <form id="careerForm">
                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                    <div class="error" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label>🎓 Education Level</label>
                    <select id="education" required>
                        <option value="">Select your education level</option>
                        <option value="high_school">High School (10th/12th)</option>
                        <option value="diploma">Diploma/Certificate</option>
                        <option value="bachelors">Bachelor's Degree</option>
                        <option value="masters">Master's Degree</option>
                        <option value="phd">PhD/Doctorate</option>
                        <option value="professional">Professional Certification</option>
                    </select>
                    <div class="error" id="educationError"></div>
                </div>

                <div class="form-group">
                    <label>📊 Academic Percentage</label>
                    <input type="number" id="percentage" min="0" max="100" step="0.1" placeholder="Enter your percentage" required>
                    <div class="error" id="percentageError"></div>
                </div>

                <div class="form-group">
                    <label>⚡ Skills</label>
                    <div class="input-with-button">
                        <input type="text" id="skillInput" placeholder="Add a skill (e.g., Python, Design)" maxlength="50">
                        <button type="button" class="add-btn" onclick="addSkill()">+</button>
                    </div>
                    <div class="tags-container" id="skillsTags"></div>
                    <div class="error" id="skillsError"></div>
                </div>

                <div class="form-group">
                    <label>❤️ Interests</label>
                    <div class="input-with-button">
                        <input type="text" id="interestInput" placeholder="Add an interest (e.g., Technology, Art)" maxlength="50">
                        <button type="button" class="add-btn" onclick="addInterest()">+</button>
                    </div>
                    <div class="tags-container" id="interestsTags"></div>
                    <div class="error" id="interestsError"></div>
                </div>

                <button type="submit" class="submit-btn">Get Career Recommendations</button>
            </form>
        </div>
    </div>

    <div class="results-page" id="resultsPage">
        <div class="results-header">
            <h2>Your Recommended Career Paths</h2>
            <p>Click on any career to explore detailed roadmap & insights</p>
            <button class="back-btn" onclick="goBack()">← Get New Recommendations</button>
        </div>
        <div id="careerResults"></div>
    </div>

    <script>
        let skills = [];
        let interests = [];

        const careerDatabase = {
            'Software Developer': {
                skills: ['programming', 'coding', 'javascript', 'python', 'web development', 'software', 'computer science', 'algorithms', 'development', 'technology'],
                interests: ['technology', 'computers', 'coding', 'problem solving', 'innovation', 'software', 'apps', 'websites'],
                icon: '💻',
                salaries: { entry: { min: 400000, max: 800000 }, experienced: { min: 1200000, max: 3500000 } },
                requiredSkills: ['Programming Languages', 'Problem Solving', 'Software Architecture', 'Version Control', 'Testing', 'Debugging'],
                insights: [
                    'India is the global IT hub with 25% job growth projected',
                    'Major demand in Bangalore, Hyderabad, Pune, and Chennai',
                    'Strong opportunities in fintech, e-commerce, and startups',
                    'Remote work culture widely adopted post-COVID'
                ],
                learning: [
                    'Master programming languages like JavaScript, Python, or Java',
                    'Build portfolio projects and contribute to open source',
                    'Get certified in cloud platforms (AWS, Azure, GCP)',
                    'Practice on coding platforms like HackerRank and LeetCode',
                    'Join coding bootcamps and developer communities'
                ],
                roadmap: [
                    {
                        phase: 'Foundation (0-3 months)',
                        duration: '3 months',
                        skills: ['HTML/CSS Basics', 'JavaScript Fundamentals', 'Git & GitHub', 'Basic Programming Logic'],
                        resources: [

        function addSkill() {
            const input = document.getElementById('skillInput');
            const value = input.value.trim();
            
            if (value && !skills.includes(value.toLowerCase())) {
                skills.push(value.toLowerCase());
                renderTags('skillsTags', skills, removeSkill);
                input.value = '';
                document.getElementById('skillsError').textContent = '';
            }
        }

        function addInterest() {
            const input = document.getElementById('interestInput');
            const value = input.value.trim();
            
            if (value && !interests.includes(value.toLowerCase())) {
                interests.push(value.toLowerCase());
                renderTags('interestsTags', interests, removeInterest);
                input.value = '';
                document.getElementById('interestsError').textContent = '';
            }
        }

        function removeSkill(index) {
            skills.splice(index, 1);
            renderTags('skillsTags', skills, removeSkill);
        }

        function removeInterest(index) {
            interests.splice(index, 1);
            renderTags('interestsTags', interests, removeInterest);
        }

        function renderTags(containerId, items, removeFunction) {
            const container = document.getElementById(containerId);
            container.innerHTML = items.map((item, index) => `
                <div class="tag">
                    ${item}
                    <button class="remove-btn" onclick="${removeFunction.name}(${index})">×</button>
                </div>
            `).join('');
        }

        document.getElementById('skillInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSkill();
            }
        });

        document.getElementById('interestInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addInterest();
            }
        });

        document.getElementById('careerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
            
            let isValid = true;
            
            const name = document.getElementById('name').value.trim();
            if (!name) {
                document.getElementById('nameError').textContent = 'Please enter your name';
                isValid = false;
            }
            
            const education = document.getElementById('education').value;
            if (!education) {
                document.getElementById('educationError').textContent = 'Please select your education level';
                isValid = false;
            }
            
            const percentage = document.getElementById('percentage').value;
            if (!percentage || percentage < 0 || percentage > 100) {
                document.getElementById('percentageError').textContent = 'Please enter a valid percentage (0-100)';
                isValid = false;
            }
            
            if (skills.length === 0) {
                document.getElementById('skillsError').textContent = 'Please add at least one skill';
                isValid = false;
            }
            
            if (interests.length === 0) {
                document.getElementById('interestsError').textContent = 'Please add at least one interest';
                isValid = false;
            }
            
            if (!isValid) return;
            
            document.getElementById('loadingOverlay').classList.add('show');
            
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            const userData = {
                name,
                education,
                percentage: parseFloat(percentage),
                skills,
                interests
            };
            
            const matches = calculateCareerMatches();
            
            // Save to history
            saveToHistory(userData);
            
            displayResults(matches, userData);
            
            document.getElementById('loadingOverlay').classList.remove('show');
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('resultsPage').classList.add('show');
        });

        function calculateCareerMatches() {
            const matches = [];
            
            for (const [careerName, careerData] of Object.entries(careerDatabase)) {
                let matchScore = 0;
                let matchedSkills = 0;
                let matchedInterests = 0;
                
                skills.forEach(skill => {
                    if (careerData.skills.some(cs => cs.includes(skill) || skill.includes(cs))) {
                        matchedSkills++;
                    }
                });
                
                interests.forEach(interest => {
                    if (careerData.interests.some(ci => ci.includes(interest) || interest.includes(ci))) {
                        matchedInterests++;
                    }
                });
                
                const skillMatch = skills.length > 0 ? (matchedSkills / skills.length) * 60 : 0;
                const interestMatch = interests.length > 0 ? (matchedInterests / interests.length) * 40 : 0;
                matchScore = Math.round(skillMatch + interestMatch);
                
                if (matchScore > 0) {
                    matches.push({
                        name: careerName,
                        data: careerData,
                        score: matchScore
                    });
                }
            }
            
            matches.sort((a, b) => b.score - a.score);
            
            return matches.slice(0, 3);
        }

            const card = document.getElementById(`career-${index}`);

                                                    ${phase.resources.map(resource => `
                                                        <a href="${resource.url}" target="_blank" class="resource-card">
                                                            <div class="resource-name">${resource.name}</div>
                                                            <span class="resource-type type-${resource.type.toLowerCase().replace(/\//g, '-').replace(/ /g, '-')}">${resource.type}</span>
                                                        </a>
                                                    `).join('')}
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                    
                                    <div class="certifications-section">
                                        <h4>🏆 Recommended Certifications</h4>
                                        <div class="cert-grid">
                                            ${match.data.certifications.map(cert => `
                                                <div class="cert-item">
                                                    <span>✓</span>
                                                    <span>${cert}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatSalary(amount) {
            if (amount >= 100000) {
                return (amount / 100000).toFixed(1) + 'L';
            }
            return amount.toLocaleString('en-IN');
        }

        // Save search to history
        function saveToHistory(userData) {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) return;

            const historyKey = `careerHistory_${currentUser.email}`;
            let history = JSON.parse(localStorage.getItem(historyKey) || '[]');

            const historyEntry = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                name: userData.name,
                education: userData.education,
                experience: userData.percentage,
                location: 'India', // Default location
                skills: userData.skills,
                interests: userData.interests.join(', ')
            };

            history.unshift(historyEntry); // Add to beginning
            
            // Keep only last 50 searches to prevent localStorage overflow
            if (history.length > 50) {
                history = history.slice(0, 50);
            }

            localStorage.setItem(historyKey, JSON.stringify(history));
        }

        function goBack() {
            document.getElementById('resultsPage').classList.remove('show');
            document.getElementById('mainPage').style.display = 'block';
            
            document.getElementById('careerForm').reset();
            skills = [];
            interests = [];
            document.getElementById('skillsTags').innerHTML = '';
            document.getElementById('interestsTags').innerHTML = '';
        }

        // Authentication functionality
        function updateAuthSection() {
            const authSection = document.getElementById('authSection');
            const currentUser = localStorage.getItem('currentUser');

            if (currentUser) {
                const user = JSON.parse(currentUser);
                authSection.innerHTML = `
                    <div class="user-info">
                        <a href="history.html" class="history-link">📚 History</a>
                        <span class="user-name">👋 ${user.name}</span>
                        <button class="logout-btn" onclick="handleLogout()">Logout</button>
                    </div>
                `;
            } else {
                authSection.innerHTML = `
                    <a href="Auth.html" class="auth-link">Login / Register</a>
                `;
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUser');
                alert('You have been logged out successfully!');
                window.location.href = 'auth.html';
            }
        }

        // Check authentication on page load
        function checkAuthentication() {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                // User not logged in, redirect to auth page
                alert('Please login or register to access the AI Career Guide');
                window.location.href = 'Auth.html';
                return false;
            }
            return true;
        }

        // Load history item if coming from history page
        function loadHistoryItem() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('fromHistory') === 'true') {
                const historyItem = sessionStorage.getItem('viewHistoryItem');
                if (historyItem) {
                    const item = JSON.parse(historyItem);
                    
                    // Populate form with history data
                    if (item.name) document.getElementById('name').value = item.name;
                    if (item.education) document.getElementById('education').value = item.education;
                    if (item.experience) document.getElementById('percentage').value = item.experience;
                    
                    // Populate skills
                    if (item.skills && item.skills.length > 0) {
                        skills = [...item.skills];
                        renderTags('skillsTags', skills, removeSkill);
                    }
                    
                    // Populate interests
                    if (item.interests) {
                        const interestArray = item.interests.split(',').map(i => i.trim().toLowerCase()).filter(i => i);
                        interests = interestArray;
                        renderTags('interestsTags', interests, removeInterest);
                    }
                    
                    // Clear the session storage
                    sessionStorage.removeItem('viewHistoryItem');
                    
                    // Scroll to form
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }

        // Initialize auth section on page load
        window.addEventListener('load', () => {
            if (checkAuthentication()) {
                updateAuthSection();
                loadHistoryItem();
            }
        });
    </script>
</body>
